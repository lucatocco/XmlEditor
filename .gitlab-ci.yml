stages:
  - build-msi

build-msi-windows:
  stage: build-msi
  tags:
    - shared-windows        # runner Windows condiviso di GitLab.com
  variables:
    JAVA_VERSION: "21"
  script:
    # 1. Installa JDK 21 con winget (disponibile sulle VM Windows di GitLab)
    - winget install EclipseAdoptium.Temurin.21.JDK --silent --accept-source-agreements --accept-package-agreements
    - $env:PATH = "C:\Program Files\Eclipse Adoptium\jdk-21*\bin;" + $env:PATH
    - $env:JAVA_HOME = (Get-ChildItem "C:\Program Files\Eclipse Adoptium\" | Where-Object { $_.Name -like "jdk-21*" } | Select-Object -First 1).FullName
    - java -version

    # 2. Maven (già presente sulle VM Windows di GitLab, altrimenti installalo)
    - mvn --version

    # 3. WiX Toolset 3 (necessario per --type msi)
    - winget install WiX.WiX --silent --accept-source-agreements --accept-package-agreements
    - $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.14\bin;" + $env:PATH

    # 4. Build Maven con profilo Windows
    - mvn clean package -q -P windows

    # 5. Genera MSI con jpackage
    - |
      # Versione: unica fonte di verità è pom.xml
      $version  = ([xml](Get-Content "pom.xml")).project.version
      $jarName  = "XmlEditor-$version.jar"
      $inputDir = "target\jpackage-input"
      $outDir   = "target\installer"
      New-Item -ItemType Directory -Force $inputDir | Out-Null
      New-Item -ItemType Directory -Force $outDir   | Out-Null
      Copy-Item "target\$jarName" "$inputDir\"

      & jpackage `
        --type         msi `
        --name         "XML Editor" `
        --app-version  $version `
        --vendor       "Touch Informatica S.r.l.s." `
        --description  "Editor XML con syntax highlighting e validazione XSD" `
        --input        $inputDir `
        --main-jar     $jarName `
        --main-class   it.touchinformatica.xmleditor.MainApp `
        --module-path  "target\javafx-libs" `
        --add-modules  "javafx.controls" `
        --java-options "-Dfile.encoding=UTF-8" `
        --java-options "-Dsun.stdout.encoding=UTF-8" `
        --java-options "--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED" `
        --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED" `
        --dest         $outDir `
        --win-menu `
        --win-shortcut `
        --win-dir-chooser `
        --win-menu-group "Touch Informatica" `
        --win-upgrade-uuid "a3f1e2d4-7b6c-4e8a-9d2f-1c3b5a7e9f0d"

      if ($LASTEXITCODE -ne 0) { exit 1 }

  artifacts:
    name: "XML-Editor-MSI"
    paths:
      - target/installer/*.msi
    expire_in: 30 days

  # Esegui solo su push a main, oppure manualmente
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: manual

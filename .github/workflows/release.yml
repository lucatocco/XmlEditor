name: Release

# Un rilascio parte SOLO da un tag: git tag v2.1.0 && git push origin v2.1.0
# (lo fa per te install/bump-version.sh)
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write        # necessario per creare la GitHub Release

jobs:
  # Il tag e pom.xml devono dire la stessa cosa, altrimenti si rilascia
  # un MSI con un numero e si annuncia una release con un altro.
  verifica-versione:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Il tag deve corrispondere alla versione di pom.xml
        run: |
          POM_VERSION=$(sed -n 's|^[[:space:]]*<version>\(.*\)</version>.*|\1|p' pom.xml | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pom.xml : $POM_VERSION"
          echo "tag     : $TAG_VERSION"
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non corrisponde alla versione $POM_VERSION di pom.xml"
            exit 1
          fi

  # Riusa lo stesso identico workflow del build quotidiano: nessuna duplicazione
  build:
    needs: verifica-versione
    uses: ./.github/workflows/build-packages.yml

  pubblica:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica i pacchetti prodotti dal build
        uses: actions/download-artifact@v4
        with:
          pattern: XML-Editor-*
          merge-multiple: true
          path: dist

      - name: Crea la GitHub Release con gli installer allegati
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist/
          # Entrambi i pacchetti devono esserci: una release monca è peggio
          # di una release fallita, perché sembra completa
          [ -n "$(ls dist/*.msi 2>/dev/null)" ] || { echo "::error::MSI mancante"; exit 1; }
          [ -n "$(ls dist/*.deb 2>/dev/null)" ] || { echo "::error::DEB mancante"; exit 1; }

          # Se la release esiste già (re-run del workflow) si aggiornano gli allegati
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME già presente: aggiorno gli installer"
            gh release upload "$GITHUB_REF_NAME" dist/*.msi dist/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.msi dist/*.deb \
              --title "XML Editor $GITHUB_REF_NAME" \
              --generate-notes
          fi
          echo "Release pubblicata: $(gh release view "$GITHUB_REF_NAME" --json url -q .url)"
